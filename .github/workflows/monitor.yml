name: Refresh NIS2 official updates

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: nis2-update-monitor
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tracker
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Refresh official discovery feed
        run: python3 scripts/check_updates.py --output public/data/updates.json

      - name: Commit feed changes
        id: commit
        shell: bash
        run: |
          if git diff --quiet -- public/data/updates.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/updates.json
          git commit -m "chore: refresh NIS2 official updates"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Summarize result
        run: |
          if [ "${{ steps.commit.outputs.changed }}" = "true" ]; then
            echo "The official discovery feed changed and was committed."
          else
            echo "No normalized feed change detected."
          fi

      - name: Trigger Pages deployment for a changed feed
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
